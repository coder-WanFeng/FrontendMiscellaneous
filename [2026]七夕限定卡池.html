        <title>七夕限定卡池｜一发入魂</title>
        <style>
            :root{
                --max-width: 600px;
            }
            /* 动画 */
            @keyframes card_ani{
                0%{
                    transform: scale(0);
                    opacity: 0;
                    transform:translateY(-50%);
                }
                100%{
                    transform: scale(1);
                    opacity: 1;
                }
            }

            @keyframes barrage_move{
                0%{
                    transform:translateX(0);
                }
                100%{
                    transform:translateX(-150vw);
                }
            }
            /* 什么时候body才能不自带margin啊... */
            body{
                margin: 0;
                padding: 0;
            }
            /* 背景 */
            #BG {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
            }
            #LT{
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at top left, rgba(255, 154, 139, 0.5), transparent);
            }
            #RT{
                position: absolute;
                top: 0;
                right: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at top right, rgba(163, 216, 244, 0.5), transparent);
            }
            #BG-cover{
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at bottom, #fff4,#fff0);
            }

                color: #5a6270;
                text-align: center;
                line-height: 50px;
                font-size: 2.5vh;
                font-weight: bold;
                border:#f5f5f555 solid 6px;
                border-radius: 4vh;

            /* tip */
            #tip{
                position: relative;
                margin:0 5vw;
                height: auto;
                width: 90vw;
                font-size: 12px;
                text-wrap: balance;
                text-align: center;
                color: #5a6270aa;
            }
            /* 主体 */
            #main{
                position: relative;
                margin:1vh auto;
                width: 90vw;
                height: 120vw;
                background-size: cover;
                background-color:#fff6;
                border:#9996 solid 1px;
                border-radius: 4vw;
            }
            /* 按键 */
            button{
                position: relative;
                margin: 3vw 1vw 1.5vw 1vw;
                width: 15vw;
                height: 8vw;
                border-radius: 2vw;
                background-color:#fff6;
                border:#9996 solid 1px;
                font-size: 4vw;
                color: #fbf8f8;
            }
            #gacha1{
                margin-left: 3vw;
                background: linear-gradient(90deg, #ff9a8b, #ffbd87);
                box-shadow: 0 8px 24px rgba(255, 157, 139, 0.35);
            }
            #gacha10{
                background: linear-gradient(90deg, #a3d8f4, #a1e5d9);
                box-shadow: 0 8px 24px rgba(163, 216, 244, 0.35);
            }
            #reset{
                color: #5a6270;
            }
            /* 卡片区 */
            #cards{
                position: relative;
                top: 0;
                left: 0;
                width: calc(90vw - 12px);
                height: calc(120vw - 12px - 12.5vw);
                display:grid;
                grid-template-columns: 1fr 1fr; 
                gap:2px;
                grid-auto-rows: calc(24vw - 4px - 2.5vw);
                padding:0 6px 6px 6px;
                justify-content: center;
                align-items: center;
                overflow-y: auto;
                overflow-x: hidden;
            }
            /* 卡片 */
            .card{
                position: relative;
                width: 35vw;
                height: 12vw;
                margin: 5px 4%;
                border-radius: 3vw;
                padding: 8px;
                display: inline-grid;
                place-items: center;
                justify-content: center;
                text-wrap: balance;
                align-items: center;
                font-size: 16px;
                text-align: center;
                color: #5a6270;
                background-color: #fff6;
                border:#ede5e5f5 solid 3px;
                animation: card_ani 0.47s ease-in-out;
            }
            .card_R{
                background:linear-gradient(135deg, #d0cdce96 45%, #a3d8f4);
            }
            .card_SR{
                background:linear-gradient(135deg, #c9c6 45%, #a3d8f4);
            }
            .card_SSR{
                background:linear-gradient(135deg, #f906, #a3d8f4);
            }
            .card_UR{
                background:radial-gradient(
                    220px 100px at 80% -10%,
                    rgba(255, 255, 255, 0.6),
                    transparent 60%
                ),
                radial-gradient(
                    160px 80px at 20% 110%,
                    rgba(255, 255, 255, 0.45),
                    transparent 65%
                ),
                conic-gradient(
                    from 210deg at 50% 50%,
                    rgba(255, 196, 140, 0.65),
                    rgba(210, 160, 255, 0.7),
                    rgba(170, 200, 255, 0.7),
                    rgba(255, 196, 140, 0.65)
                )
            }
            /* 卡片稀有度标签 */
            .card_tag{
                position: absolute;
                top:1vw;
                left:1vw;
                width: 4.5vw;
                height: 3vw;
                border:#6665 solid 0.2vw;
                border-radius: 1vw;
                font-size: 2vw;
                padding:0;
                font-weight:900;
                background-color: #fff4;
            }
            .card_tag_R{
                color: #5a6270;
            }
            .card_tag_SR{
                color: #db8bdc;
            }
            .card_tag_SSR{
                color: #f90b;
            }
            .card_tag_UR{
                color:#e76c99;
                font-weight: 600;
                text-shadow: 
                1px 1px 2px rgba(255, 196, 140, 0.9),
                -1px 1px 2px rgba(210, 160, 255, 0.9),
                0 -1px 2px rgba(170, 200, 255, 0.9),
                1.5px 1.5px 2px rgba(255, 196, 140, 0.6),
                -1.5px 1.5px 2px rgba(210, 160, 255, 0.6),
                0 -1.5px 2px rgba(170, 200, 255, 0.6);
            }
            /* 弹幕 */
            #Barrages{
                position: fixed;
                height: 100vh;
                width: 100vw;
                top: 0;
                left: 0;
                pointer-events: none;
            }
            .barrage{
                position: fixed;
                left: 100vw;
                width: max-content;
                padding: 0.5vw 2vw;
                height: 4vw;
                border-radius: 2vw;
                background-color:#fff8;
                border:#9996 solid 1px;
                font-size: 2.75vw;
                color: #5a6270;
                z-index: 9999;
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px); 
            }
            /* 烟花 */
            .firework{
                position:fixed;
                border-radius:50%;
                pointer-events:none;
                will-change:transform,opacity
            }
        </style>

            // 历史记录
            let history = [];
            // 运行状态
            let running = false;
            // 烟花颜色
            const C=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f1c','#e056fd','#00d2d3'];
            
            // 事件绑定
            $("#gacha1").click(()=>{
                if(running) return;
                running = true;
                $("button").css("opacity","0.5");
                reset();
                gacha();
                setTimeout(()=>{
                    running = false;
                    $("button").css("opacity","1");
                }, 300);
            });
            $("#gacha10").click(()=>{
                if (running) return;
                running = true;
                $("button").css("opacity","0.5");
                reset();
                for(let i=0;i<10;i++){
                    setTimeout(gacha, i*250);
                }
                setTimeout(()=>{
                    running = false;
                    $("button").css("opacity","1");
                }, 2800);
            });
            $("#reset").click(()=>{
                if (running) return;
                reset();
            });


            // 抽卡函数
            function gacha(){
                let totalWeight = cardList.reduce((sum, card) => sum + card.weight, 0);
                let randomNum = Math.random() * totalWeight;
                let cumulativeWeight = 0;
                for (let card of cardList) {
                    cumulativeWeight += card.weight;
                    if (randomNum < cumulativeWeight) {
                        history.push(card);
                        // 绘制卡片
                        drawCard(card);
                        // 创建随机弹幕效果
                        showBarrage(card);
                        // 烟花
                        if(card.tag == "SSR") firework(2);
                        if(card.tag == "UR") firework(5);
                        break;
                    }
                }
            };
            // 清空函数
            function reset(){
                history = [];
                $("#cards").html("");
                $("#Barrages").html("");
            };

            // 绘制卡片
            function drawCard(card){
                // 卡片
                let cardDiv = $("<div></div>");
                cardDiv.addClass(`card card_${card.tag}`);
                cardDiv.text(`${card.label}`);
                cardDiv.css({"grid-row":Math.ceil(history.length / 2),"grid-column":((history.length + 1) % 2) + 1});
                // 稀有度
                let tagDiv = $(`<div>${card.tag}</div>`);
                tagDiv.addClass(`card_tag card_tag_${card.tag}`);
                // 添加稀有度到卡片
                cardDiv.append(tagDiv);
                // 添加卡片到页面
                $("#cards").append(cardDiv);
            };

            // 弹幕效果:
            function showBarrage(card) {
                let barrage = $('<div></div>');
                barrage.addClass('barrage');
                barrage.text(`已抽中${card.tag} : ${card.label}`);
                $("#Barrages").append(barrage);
            };

            // 弹幕效果:
            function showBarrage(card) {
                let barrage = $('<div></div>');
                barrage.addClass('barrage');
                barrage.text(`已抽中 ${card.tag} : ${card.label}`);
                setTimeout(() => {
                    barrage.css("animation", `barrage_move ${ 2 + Math.random() * 4 }s linear`);
                    barrage.css("top",`${ 20 + Math.random()*60 }vh`)
                    $("#Barrages").append(barrage);
                },Math.random()*2000);
            };

            // 烟花
            function firework(N){for(let r=N;r--;)setTimeout(launch,r*700)}
            function launch(){
                let x=Math.random()*innerWidth*.3+innerWidth*.35,y=innerHeight,vx=(Math.random()-.5)*2,vy=-(4+Math.random()*1);
                const $r=$('<div class="firework">').css({width:6,height:6,background:C[Math.floor(Math.random()*C.length)],left:x,top:y}).appendTo('body');
                !function rise(){
                    vy+=.02; y+=vy; x+=vx;
                    $r.css({left:x,top:y});
                    vy>0?explode(x,y,vx,$r):requestAnimationFrame(rise);
                }();
            }
            function explode(x,y,vx,$r){
                const c=$r.css("background").split(")")[0]+")";
                $r.remove();
                for(let i=36;i--;){
                    let a=i/36*6.28+Math.random()*.3,v=1.5+Math.random()*2.5,px=x,py=y,pvx=Math.cos(a)*v+vx*.4,pvy=Math.sin(a)*v-2;
                    const $p=$('<div class="firework">').css({width:5,height:5,backgroundColor:c,left:px,top:py}).appendTo('body');
                    !function fall(){
                        pvy+=.06; pvx*=.995; px+=pvx; py+=pvy;
                        $p.css({left:px,top:py});
                        py<innerHeight+30?requestAnimationFrame(fall):$p.remove();
                    }();
                }
            }
            
        </script>
